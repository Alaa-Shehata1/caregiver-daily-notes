name: Mobile

on:
  push:
    branches: [main, preview/full-stack]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --ci

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        # v4: installs cmdline-tools + platform-tools, accepts licenses, and
        # no longer requests the removed "tools" package (v3 fails on it).
        uses: android-actions/setup-android@v4

      - name: Install required SDK packages
        # Must match mobile/android/build.gradle: compileSdk 36, buildTools
        # 36.0.0, ndkVersion 27.1.12297006. setup-android already provides
        # cmdline-tools + platform-tools and accepts licenses (upstream
        # README); it never installs the deprecated "tools" package
        # (skipped with a warning even if requested), so don't ask for it.
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - run: npm ci
        working-directory: mobile

      - name: Build debug APK, arm64 only (preview size squeeze)
        run: |
          chmod +x gradlew
          ./gradlew assembleArm64V8aDebug --no-daemon
        working-directory: mobile/android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
